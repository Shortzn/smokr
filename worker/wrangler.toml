# Smokr Community API. Kostenlos nutzbar: Workers Free, D1 Free.
# Secrets (nie im Repository): TURNSTILE_SECRET, IP_SALT, SESSION_KEY, ADMIN_PASSWORD_HASH
name = "smokr-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://shortzn.github.io"
# Community-Schalter: off | private (nur mit Testercode) | public
COMMUNITY_MODE = "private"
TURNSTILE_HOSTNAMES = "shortzn.github.io"

[[d1_databases]]
binding = "DB"
database_name = "smokr-community"
# Wird beim ersten Einrichten von scripts in worker/tools/setup.sh eingetragen
database_id = "00892a63-e48c-4e70-85eb-d1597b63fb6a"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]

# Keine dauerhaften Anfrage-Logs bei Cloudflare (Datenschutz). Live-Fehlersuche: npx wrangler tail
[observability]
enabled = false
